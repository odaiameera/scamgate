# scamgate rules config.
# Each rule's weight is added to the risk score when it fires (score is capped at 100).
# decision: score >= deny -> deny, score >= ask -> ask, otherwise allow.
thresholds:
  ask: 25
  deny: 70

rules:
  # --- URL rules ---
  url.unreadable:       { enabled: true,  weight: 40 }    # can't tell where the link goes: ask, never allow
  url.blocklist:        { enabled: true,  weight: 100 }   # your own list (data/blocklist.txt)
  # Known-bad-link feeds (cached by `scamgate update-feeds`, looked up offline).
  # exact URL listed -> deny; exact host listed -> 75 (deny on its own);
  # parent domain listed (domain feeds only) -> 50.
  url.known_bad_feed:   { enabled: true,  weight: 100, host_weight: 75, parent_weight: 50 }
  url.lookalike_brand:  { enabled: true,  weight: 60, exact_token_weight: 45, official_prefix_weight: 80 }
  url.userinfo:         { enabled: true,  weight: 40, disguise_weight: 75 }  # 'paypal.com@evil.example'
  url.ip_host:          { enabled: true,  weight: 40 }
  url.punycode:         { enabled: true,  weight: 40 }
  url.suspicious_tld:   { enabled: true,  weight: 20 }
  url.intent_mismatch:  { enabled: true,  weight: 45, secret_weight: 80 }
  url.credential_page:  { enabled: true,  weight: 25 }   # login page on an unrecognised site; waivable per host
  url.domain_age:       { enabled: true,  weight: 30, min_age_days: 30 }  # only with SCAMGATE_RDAP=cache|live

  # --- Payment rules ---
  pay.new_payee_urgency:    { enabled: true, weight: 35 }
  pay.bank_details_changed: { enabled: true, weight: 50 }
  pay.irreversible_method:  { enabled: true, weight: 35, new_payee_transfer_weight: 25, new_payee_transfer_vop_match_weight: 10 }
  pay.method_restricted:    { enabled: true, weight: 30 }
  pay.over_budget:          { enabled: true, weight: 30 }
  pay.pressure_phrases:     { enabled: true, weight: 35 }
  pay.unbacked_known_claim: { enabled: true, weight: 15 }
  pay.vop_mismatch:
    enabled: true
    weights: { no_match: 60, close_match: 25, unavailable: 10, match: 0 }

lists:
  brands:
    paypal:  [paypal.com, paypal.me]
    revolut: [revolut.com, revolut.me]
    aib:     [aib.ie]
    boi:     [bankofireland.com, boi.com]
    stripe:  [stripe.com, stripe.network]
    amazon:  [amazon.com, amazon.co.uk, amazon.ie, amazon.de, amazon.fr, amazon.es, amazon.it, amazon.nl, amazonaws.com]
    apple:   [apple.com, icloud.com]
    # Brand pack: the names most used in phishing (APWG / vendor reports), plus Irish and UK banks,
    # couriers and services. Exact-name and typo checks only; keep names that are also everyday
    # words out (they'd flag normal sites), or list them under brand_typo_exempt.
    microsoft:  [microsoft.com, microsoftonline.com, live.com, outlook.com, office.com, office365.com, azure.com, xbox.com]
    outlook:    [outlook.com, live.com, microsoft.com, office.com]
    office365:  [office.com, office365.com, microsoft.com]
    google:     [google.com, google.ie, google.co.uk, gmail.com, youtube.com, googleusercontent.com]
    gmail:      [gmail.com, google.com]
    netflix:    [netflix.com]
    facebook:   [facebook.com, fb.com, meta.com]
    instagram:  [instagram.com]
    whatsapp:   [whatsapp.com, whatsapp.net]
    linkedin:   [linkedin.com]
    dropbox:    [dropbox.com, dropboxusercontent.com]
    docusign:   [docusign.com, docusign.net]
    adobe:      [adobe.com]
    ebay:       [ebay.com, ebay.ie, ebay.co.uk]
    coinbase:   [coinbase.com]
    binance:    [binance.com]
    metamask:   [metamask.io]
    kraken:     [kraken.com]
    dhl:        [dhl.com, dhl.ie, dhl.co.uk, dhl.de]
    fedex:      [fedex.com]
    anpost:     [anpost.ie, anpost.com]
    royalmail:  [royalmail.com]
    evri:       [evri.com]
    usps:       [usps.com]
    hmrc:       [hmrc.gov.uk, gov.uk]
    ptsb:       [ptsb.ie]
    bankofireland: [bankofireland.com, boi.com]
    ulsterbank: [ulsterbank.ie, ulsterbank.co.uk]
    hsbc:       [hsbc.com, hsbc.co.uk]
    barclays:   [barclays.co.uk, barclays.com]
    natwest:    [natwest.com]
    santander:  [santander.co.uk, santander.com]
    lloyds:     [lloydsbank.com, lloyds.com]
    monzo:      [monzo.com]
    starling:   [starlingbank.com]
    bunq:       [bunq.com]
    n26:        [n26.com]
    klarna:     [klarna.com]
    wellsfargo: [wellsfargo.com]
    venmo:      [venmo.com]
    cashapp:    [cash.app, cashapp.com]
    airbnb:     [airbnb.com, airbnb.ie, airbnb.co.uk]
    booking:    [booking.com]
    ryanair:    [ryanair.com]
    aerlingus:  [aerlingus.com]

  # Everyday words one letter away from a brand ('finance' ~ 'binance'). The typo check skips them.
  brand_typo_exempt: [finance, finances, kroken, broken, token, tokens, monza, months, mondo, lloyd, cashap,
                      starting, startling, sparling, docusing, adore, adobo, netflux, ebays, fedx, bunk, bung,
                      booking, cooking, looking, hooking, rooking, ryanairs, outlooks, metamorph, hsbcs, n25, n27,
                      venom, venue, venus, klara, klarne]

  # Padding scammers put around a brand name ('appleid', 'securepaypal', 'amazonrefund').
  # A brand inside any other word ('applebees', 'revolution', 'pineapple') isn't flagged.
  brand_affixes: [id, login, logon, signin, sign, secure, security, safe, verify, verification, verified, validate,
                  support, help, helpdesk, desk, service, services, svc, account, accounts, acct, update, updates,
                  billing, bill, pay, payment, payments, my, online, app, apps, web, portal, auth, alert, alerts,
                  notice, center, centre, team, care, customer, customers, client, refund, refunds, unlock, unlocks,
                  recovery, recover, restore, official, store, shop, gift, card, cards, wallet, connect, check, checks,
                  confirm, mail, cloud, user, users, member, members, uk, ie, us, eu, de, global, inc, ltd, get, go,
                  www, login, access, hub, info, dept, claim, claims, prize, reward, rewards, bonus, invoice, order,
                  orders, delivery, track, tracking, case, review, reviews, limited, limit, suspend, suspended,
                  locked, lock, block, blocked, protect, protection, fraud, team, official, net, com, now, here, x]

  # Big shared platforms (file hosts, form builders, shorteners, identity providers).
  # Feeds list single bad pages on these, so a host/domain hit here is ignored; only an
  # exact-URL listing counts. Each entry also covers its subdomains.
  feed_host_ignore:
    - google.com
    - googleapis.com
    - forms.gle
    - goo.gl
    - microsoftonline.com
    - microsoft.com
    - live.com
    - office.com
    - sharepoint.com
    - 1drv.ms
    - discordapp.com
    - discordapp.net
    - github.com
    - githubusercontent.com
    - gitlab.com
    - bitbucket.org
    - dropbox.com
    - dropboxusercontent.com
    - mediafire.com
    - pastebin.com
    - t.me
    - telegra.ph
    - bit.ly
    - tinyurl.com
    - t.co
    - linktr.ee
    - ipfs.io
    - facebook.com
    - linkedin.com

  suspicious_tlds: [zip, mov, top, xyz, click, country, gq, tk, ml, cf, ga, rest, cam, icu, sbs, cfd, shop, buzz, lol]

  # URL terms that ask for credentials or secrets.
  credential_terms: [login, log-in, signin, sign-in, verify-account, account-verify, unlock, password, otp, 2fa]
  secret_terms: [seed, seed-phrase, seedphrase, mnemonic, recovery-phrase, private-key, privatekey, connect-wallet, wallet-connect]
  # If the agent's stated intent contains one of these, credential terms are expected.
  credential_intent_terms: [log in, login, sign in, signin, account, password, my bank, banking]

  urgency_terms:
    - urgent
    - urgently
    - immediately
    - asap
    - right away
    - today
    - within the hour
    - end of day
    - before close of business
    - deadline
    - final notice
    - last chance

  pressure_phrases:
    - act now
    - keep this confidential
    - keep this between us
    - do not tell the bank
    - don't tell the bank
    - do not tell anyone
    - don't tell anyone
    - guaranteed returns
    - guaranteed return
    - risk-free
    - double your money
    - police will
    - arrest warrant
    - your account will be closed
    - do not call
    - i'm in meetings

  bank_change_phrases:
    - new bank details
    - changed our bank
    - updated bank details
    - updated account details
    - new account details
    - changed bank account
    - new iban

  method_restriction_phrases:
    - only accept crypto
    - crypto only
    - only accept usdt
    - only accept bitcoin
    - usdt only
    - bitcoin only
    - gift card
    - gift cards
    - no cards
    - no card payments
    - bank transfer only
    - only accept bank transfer
    - friends and family
