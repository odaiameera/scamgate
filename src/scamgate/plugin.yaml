name: scamgate
version: "0.3.1"
description: "Offline scam gate. Blocks known-bad links and payments before a tool runs, and asks a human when it cannot see the destination."
author: Odai Ameera
requires_hermes: ">=0.19.1"
provides_hooks:
  - pre_tool_call
  - post_tool_call
provides_tools:
  - scamgate_check_url
  - scamgate_check_payment
  - scamgate_update_feeds
python_dependencies:
  - "pydantic>=2.7,<3"
  - "pyyaml>=6.0,<7"
config_schema:
  when_approvals_off:
    type: str
    description: "When Hermes approvals are off, block asks (default) or allow them."
    default: block
  auto_update_feeds:
    type: bool
    description: "Refresh the phishing lists in the background every 6 hours (default on). Set false to refresh only with /scamgate update or hermes scamgate update-feeds."
    default: true
