[project]
name = "scamgate"
version = "0.3.3"
description = "Self-hosted scam check for AI agents: verify links and payments before they act"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai-agents", "security", "phishing", "scam", "mcp", "claude-code", "hermes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
authors = [{ name = "Odai Ameera" }]
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://odaiameera.github.io/scamgate/"
Source = "https://github.com/odaiameera/scamgate"
Changelog = "https://github.com/odaiameera/scamgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/odaiameera/scamgate/issues"

[project.scripts]
scamgate = "scamgate.entry:main"
scamgate-hook = "scamgate.hook_entry:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scamgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
