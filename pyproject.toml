[project]
name = "scamgate"
version = "0.1.0"
description = "Self-hosted scam check for AI agents: verify links and payments before they act"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Odai Ameera" }]
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
scamgate = "scamgate.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scamgate"]

[tool.hatch.build.targets.wheel.force-include]
"data/blocklist.txt" = "scamgate/_data/blocklist.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
