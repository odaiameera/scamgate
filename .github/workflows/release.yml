name: release

# Runs when a GitHub release is published. Builds the wheel and sdist once, checks them, then publishes the
# same files to PyPI (trusted publishing, no token), attaches them to the GitHub release with SHA256SUMS.txt,
# and lists the new version in the MCP Registry (GitHub OIDC, no token).
#
# One-time setup on pypi.org: a trusted publisher for project "scamgate", owner "odaiameera", repository
# "scamgate", workflow "release.yml", environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: The tag names the package version everywhere
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(uv version --short)
          test "v$v" = "$TAG" || { echo "tag $TAG doesn't match pyproject version $v"; exit 1; }
          grep -q "\"version\": \"$v\"" server.json
          grep -q "\"version\": \"$v\"" claude-plugin/.claude-plugin/plugin.json
          grep -q "uvx scamgate==$v hook" claude-plugin/hooks/hooks.json
          grep -q "\"scamgate==$v\"" claude-plugin/.mcp.json
      - name: Build
        run: uv build --out-dir dist
      - name: Check the built wheel the way the plugin runs it
        run: |
          uv run --no-project python scripts/claude_plugin_smoke.py dist/scamgate-*-py3-none-any.whl
          uvx --from dist/scamgate-*-py3-none-any.whl scamgate bench --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/scamgate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attach the published files and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum scamgate-* > SHA256SUMS.txt
          gh release upload "$TAG" scamgate-* SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher 1.8.4 (checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz
          echo "5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait until PyPI serves this version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/scamgate/${TAG#v}/json" > /dev/null && exit 0
            sleep 10
          done
          echo "PyPI doesn't list scamgate ${TAG#v} yet"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
